id: t09_rc_lock_limit_recheck
title: Blocked FOR UPDATE with LIMIT after the first row stops qualifying
isolation: read committed
sessions: [A, B]
setup: |
  CREATE TABLE jobs (id int PRIMARY KEY, status text);
  INSERT INTO jobs VALUES (1, 'queued'), (2, 'queued'), (3, 'queued');
schedule:
  - {step: 1, session: A, sql: "BEGIN"}
  - {step: 2, session: B, sql: "BEGIN"}
  - {step: 3, session: A, sql: "UPDATE jobs SET status = 'done' WHERE id = 1"}
  - {step: 4, session: B, sql: "SELECT id FROM jobs WHERE status = 'queued' ORDER BY id LIMIT 1 FOR UPDATE"}
  - {step: 5, session: A, sql: "COMMIT"}
  - {step: 6, session: B, sql: "UPDATE jobs SET status = 'claimed' WHERE status = 'queued' AND id = (SELECT min(id) FROM jobs WHERE status = 'queued')"}
  - {step: 7, session: B, sql: "COMMIT"}
observe_steps: [4]
final_query: "SELECT id, status FROM jobs ORDER BY id"
why_hard: >
  Hypothesis (Claude draft, Dhyan to review): B blocks on row 1, re-checks it after A commits and
  drops it. Executed truth: the LIMIT then pulls row 2, so the claim moves on rather than returning nothing.
category: rc_recheck
