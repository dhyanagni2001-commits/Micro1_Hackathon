id: t12_rr_select_for_update
title: REPEATABLE READ locking read of a row changed after the snapshot
isolation: repeatable read
sessions: [A, B]
setup: |
  CREATE TABLE accounts (id int PRIMARY KEY, balance int);
  INSERT INTO accounts VALUES (1, 100), (2, 100);
schedule:
  - {step: 1, session: B, sql: "BEGIN"}
  - {step: 2, session: B, sql: "SELECT id, balance FROM accounts ORDER BY id"}
  - {step: 3, session: A, sql: "BEGIN"}
  - {step: 4, session: A, sql: "UPDATE accounts SET balance = 0 WHERE id = 2"}
  - {step: 5, session: A, sql: "COMMIT"}
  - {step: 6, session: B, sql: "SELECT id, balance FROM accounts WHERE id = 1 FOR UPDATE"}
  - {step: 7, session: B, sql: "SELECT id, balance FROM accounts WHERE id = 2 FOR UPDATE"}
  - {step: 8, session: B, sql: "COMMIT"}
observe_steps: [2, 6, 7]
final_query: "SELECT id, balance FROM accounts ORDER BY id"
why_hard: >
  Hypothesis (Claude draft, Dhyan to review): locking an unchanged row works, but locking the row A changed
  after B's snapshot fails with 40001 at once, without blocking because A already committed.
category: rr_snapshot
