id: t14_rc_epq_semijoin
title: READ COMMITTED re-check does not re-run a subquery
isolation: read committed
sessions: [A, B]
setup: |
  CREATE TABLE accounts (id int PRIMARY KEY, balance int);
  INSERT INTO accounts VALUES (1, 100), (2, 500);
schedule:
  - {step: 1, session: A, sql: "BEGIN"}
  - {step: 2, session: B, sql: "BEGIN"}
  - {step: 3, session: A, sql: "UPDATE accounts SET balance = balance + 50 WHERE id = 1"}
  - {step: 4, session: B, sql: "UPDATE accounts SET balance = balance * 2 WHERE id IN (SELECT id FROM accounts WHERE balance < 120) RETURNING id, balance"}
  - {step: 5, session: A, sql: "COMMIT"}
  - {step: 6, session: B, sql: "COMMIT"}
observe_steps: [4]
final_query: "SELECT id, balance FROM accounts ORDER BY id"
why_hard: >
  Hypothesis (Claude draft, Dhyan to review): the re-check only re-evaluates conditions on the target row,
  so the subquery result from B's snapshot still qualifies row 1 and B doubles 150 although it is no longer below 120.
category: rc_recheck
