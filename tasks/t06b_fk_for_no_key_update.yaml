id: t06b_fk_for_no_key_update
title: FK check does not block against FOR NO KEY UPDATE
isolation: read committed
sessions: [A, B]
setup: |
  CREATE TABLE parents (id int PRIMARY KEY, name text);
  CREATE TABLE children (id int PRIMARY KEY, parent_id int REFERENCES parents (id));
  INSERT INTO parents VALUES (1, 'p1');
schedule:
  - {step: 1, session: A, sql: "BEGIN"}
  - {step: 2, session: B, sql: "BEGIN"}
  - {step: 3, session: A, sql: "SELECT id FROM parents WHERE id = 1 FOR NO KEY UPDATE"}
  - {step: 4, session: B, sql: "INSERT INTO children VALUES (10, 1)"}
  - {step: 5, session: A, sql: "UPDATE parents SET name = 'renamed' WHERE id = 1"}
  - {step: 6, session: A, sql: "COMMIT"}
  - {step: 7, session: B, sql: "COMMIT"}
observe_steps: [3]
final_query: "SELECT p.id, p.name, c.id FROM parents p LEFT JOIN children c ON c.parent_id = p.id ORDER BY p.id, c.id"
why_hard: >
  Hypothesis (CLAUDE.md section 8): FOR KEY SHARE does not conflict with FOR NO KEY UPDATE, so the
  child insert returns at once. Only the lock strength differs from t06a.
category: lock_strength
