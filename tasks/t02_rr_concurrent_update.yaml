id: t02_rr_concurrent_update
title: REPEATABLE READ second updater fails once the first commits
isolation: repeatable read
sessions: [A, B]
setup: |
  CREATE TABLE accounts (id int PRIMARY KEY, owner text, balance int);
  INSERT INTO accounts VALUES (1, 'alice', 100), (2, 'bob', 50);
schedule:
  - {step: 1, session: A, sql: "BEGIN"}
  - {step: 2, session: B, sql: "BEGIN"}
  - {step: 3, session: B, sql: "SELECT balance FROM accounts WHERE id = 1"}
  - {step: 4, session: A, sql: "UPDATE accounts SET balance = balance - 30 WHERE id = 1"}
  - {step: 5, session: B, sql: "UPDATE accounts SET balance = balance - 20 WHERE id = 1"}
  - {step: 6, session: A, sql: "COMMIT"}
  - {step: 7, session: B, sql: "SELECT balance FROM accounts WHERE id = 1"}
  - {step: 8, session: B, sql: "COMMIT"}
observe_steps: [3, 7]
final_query: "SELECT id, owner, balance FROM accounts ORDER BY id"
why_hard: >
  Hypothesis (CLAUDE.md section 8): B gets 40001 once A commits. Models using MySQL InnoDB
  semantics predict success. The follow-up SELECT and COMMIT test the aborted transaction state.
category: rr_snapshot
